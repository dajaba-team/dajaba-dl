[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dajaba-dl"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = ["numpy==1.26.4", "torch==2.3.1", "torch-geometric==2.5.3"]

[project.scripts]
dajaba-dl-score = "dajaba_submission.dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
